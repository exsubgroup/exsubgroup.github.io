<style>
/* ── Neo-Brutalist Styles ──────────────────────────────────────── */
:root {
  --charcoal: #211F1F;
  --sand: #DBD4B7;
  --mint: #ACD1C0;
  --bg: #F5F4EB;
  --white: #FFFFFF;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  font-family: 'Inter', sans-serif;
}

/* ── Loading Overlay ──────────────────────────────────────────── */
#loadingOverlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  transition: opacity 0.5s ease;
}
#loadingOverlay.hide {
  opacity: 0;
  pointer-events: none;
}
.loader-ring {
  width: 48px;
  height: 48px;
  border: 4px solid rgba(33,31,31,0.15);
  border-top-color: var(--charcoal);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
.loader-dots {
  display: flex;
  gap: 8px;
}
.loader-dots span {
  width: 10px;
  height: 10px;
  background: var(--charcoal);
  border-radius: 50%;
  animation: dotPulse 1.4s infinite ease-in-out both;
}
.loader-dots span:nth-child(1) { animation-delay: -0.32s; }
.loader-dots span:nth-child(2) { animation-delay: -0.16s; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes dotPulse {
  0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
  40% { transform: scale(1); opacity: 1; }
}

/* ── Promo Channel Panel ──────────────────────────────────────── */
.promochannel-section {
  margin-top: 24px;
}
.promochannel-panel {
  background: var(--white);
  border: 3px solid var(--charcoal);
  border-radius: 24px;
  box-shadow: 8px 8px 0px 0px var(--charcoal);
  padding: 24px;
}
.promochannel-panel-head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
}
.promochannel-panel-title {
  font-size: 18px;
  font-weight: 800;
  color: var(--charcoal);
}
.promochannel-panel-subtitle {
  font-size: 13px;
  color: #6b7280;
  font-weight: 500;
  margin-top: 2px;
}
.promochannel-panel-controls {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

/* ── Badges ───────────────────────────────────────────────────── */
.promochannel-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  border: 2px solid var(--charcoal);
}
.promochannel-badge-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}
.promochannel-badge--ok {
  background: var(--mint);
  color: var(--charcoal);
}
.promochannel-badge--ok .promochannel-badge-dot {
  background: #16a34a;
}
.promochannel-badge--full {
  background: #fef2f2;
  color: #dc2626;
}
.promochannel-badge--full .promochannel-badge-dot {
  background: #dc2626;
}

/* ── Neo-Brutalist Buttons ────────────────────────────────────── */
.btn-retro {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 20px;
  border: 3px solid var(--charcoal);
  border-radius: 14px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.12s ease;
  text-decoration: none;
  box-shadow: 4px 4px 0px 0px var(--charcoal);
  font-family: 'Inter', sans-serif;
}
.btn-retro:hover:not(:disabled) {
  transform: translate(-2px, -2px);
  box-shadow: 6px 6px 0px 0px var(--charcoal);
}
.btn-retro:active:not(:disabled) {
  transform: translate(2px, 2px);
  box-shadow: 2px 2px 0px 0px var(--charcoal);
}
.btn-retro:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
  box-shadow: 4px 4px 0px 0px var(--charcoal);
}

.btn-charcoal {
  background: var(--charcoal);
  color: var(--sand);
  border-color: var(--charcoal);
}
.btn-charcoal:hover:not(:disabled) {
  background: #2d2a2a;
}

.btn-sand {
  background: var(--sand);
  color: var(--charcoal);
  border-color: var(--charcoal);
}
.btn-sand:hover:not(:disabled) {
  background: #c9c2a4;
}

.btn-mint {
  background: var(--mint);
  color: var(--charcoal);
  border-color: var(--charcoal);
}
.btn-mint:hover:not(:disabled) {
  background: #9bc2b1;
}

.btn-red-retro {
  background: #ef4444;
  color: #ffffff;
  border-color: var(--charcoal);
}
.btn-red-retro:hover:not(:disabled) {
  background: #dc2626;
}

.promochannel-btn-add--disabled {
  opacity: 0.45;
  cursor: not-allowed;
  pointer-events: none;
}

/* ── Channel List ─────────────────────────────────────────────── */
.promochannel-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-height: 120px;
}

/* ── Channel Card ─────────────────────────────────────────────── */
.promochannel-card {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  background: var(--bg);
  padding: 20px 24px;
  align-items: center;
  transition: all 0.15s ease;
}
.promochannel-card:hover {
  transform: translate(-2px, -2px);
}
.promochannel-card-media {
  flex-shrink: 0;
}
.promochannel-avatar-ring {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  border: 3px solid var(--charcoal);
  padding: 3px;
  background: var(--white);
  position: relative;
}
.promochannel-avatar-ring--live::after {
  content: '';
  position: absolute;
  bottom: 4px;
  right: 4px;
  width: 14px;
  height: 14px;
  background: #22c55e;
  border-radius: 50%;
  border: 2px solid var(--white);
}
.promochannel-avatar {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
}
.promochannel-card-body {
  flex: 1;
  min-width: 200px;
}
.promochannel-name {
  font-size: 18px;
  font-weight: 800;
  color: var(--charcoal);
}
.promochannel-handle {
  font-size: 13px;
  color: #6b7280;
  font-weight: 500;
  margin-top: 2px;
}
.promochannel-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 16px 24px;
  margin-top: 10px;
}
.promochannel-stat {
  display: flex;
  flex-direction: column;
}
.promochannel-stat-label {
  font-size: 10px;
  font-weight: 700;
  color: #6b7280;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.promochannel-stat-value {
  font-size: 15px;
  font-weight: 800;
  color: white;
}
.promochannel-stat-value--mono {
  font-family: 'JetBrains Mono', monospace;
}
.promochannel-visit-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--charcoal);
  text-decoration: none;
  border-bottom: 2px solid var(--charcoal);
  transition: all 0.15s ease;
}
.promochannel-visit-link:hover {
  gap: 8px;
}
.promochannel-visit-arrow {
  transition: transform 0.15s ease;
}
.promochannel-visit-link:hover .promochannel-visit-arrow {
  transform: translateX(4px);
}
.promochannel-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex-shrink: 0;
  width: 100%;
  max-width: 220px;
}
.promochannel-actions .btn-retro {
  width: 100%;
  padding: 10px 16px;
  font-size: 12px;
}

/* ── Notices ──────────────────────────────────────────────────── */
.promochannel-notice {
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
  border: 2px solid var(--charcoal);
  margin-top: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.promochannel-notice--danger {
  background: #fee2e2;
  color: #dc2626;
  border-color: #dc2626;
}
.promochannel-notice--warning {
  background: #fef3c7;
  color: #d97706;
  border-color: #d97706;
}
.promochannel-notice-label {
  font-weight: 800;
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: 0.5px;
}
.promochannel-notice-text {
  font-weight: 700;
}

/* ── Empty State ──────────────────────────────────────────────── */
.promochannel-empty {
  text-align: center;
  padding: 40px 20px;
}
.promochannel-empty-icon {
  font-size: 48px;
  margin-bottom: 12px;
}
.promochannel-empty-title {
  font-size: 20px;
  font-weight: 800;
  color: var(--charcoal);
}
.promochannel-empty-desc {
  font-size: 14px;
  color: #6b7280;
  margin-top: 4px;
  max-width: 400px;
  margin-left: auto;
  margin-right: auto;
}

/* ── Form Fields ──────────────────────────────────────────────── */
.promochannel-field-label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--charcoal);
  margin-top: 14px;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.promochannel-field-input {
  width: 100%;
  padding: 10px 14px;
  background: var(--white);
  border: 3px solid var(--charcoal);
  border-radius: 12px;
  font-size: 14px;
  font-weight: 500;
  color: var(--charcoal);
  outline: none;
  transition: all 0.15s ease;
  font-family: 'Inter', sans-serif;
}
.promochannel-field-input:focus {
  box-shadow: 4px 4px 0px 0px var(--charcoal);
}

/* ── Type Grid ────────────────────────────────────────────────── */
.promochannel-type-search-wrap {
  margin-bottom: 10px;
}
.promochannel-type-search {
  width: 100%;
  padding: 8px 12px;
  background: var(--white);
  border: 3px solid var(--charcoal);
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  color: var(--charcoal);
  outline: none;
  font-family: 'Inter', sans-serif;
}
.promochannel-type-search:focus {
  box-shadow: 3px 3px 0px 0px var(--charcoal);
}
.promochannel-type-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 8px;
  max-height: 260px;
  overflow-y: auto;
  padding: 4px 2px;
}
.promochannel-type-opt {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  background: var(--white);
  border: 2px solid var(--charcoal);
  border-radius: 10px;
  font-size: 12px;
  font-weight: 600;
  color: var(--charcoal);
  cursor: pointer;
  transition: all 0.12s ease;
}
.promochannel-type-opt:hover {
  background: var(--sand);
}
.promochannel-type-opt--selected {
  background: var(--charcoal);
  color: var(--sand);
  border-color: var(--charcoal);
}
.promochannel-type-opt--selected:hover {
  background: #2d2a2a;
}
.promochannel-type-emoji {
  font-size: 16px;
}

/* ── Modal Warning ────────────────────────────────────────────── */
.promochannel-modal-warning {
  background: #fef3c7;
  border: 2px solid #d97706;
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 13px;
  color: #78350f;
  font-weight: 500;
}

/* ── Responsive ────────────────────────────────────────────────── */
@media (max-width: 768px) {
  .promochannel-panel {
    padding: 16px;
  }
  .promochannel-panel-head {
    flex-direction: column;
    align-items: stretch;
  }
  .promochannel-panel-controls {
    flex-wrap: wrap;
  }
  .promochannel-card {
    flex-direction: column;
    align-items: stretch;
    padding: 16px;
  }
  .promochannel-actions {
    max-width: 100%;
    flex-direction: row;
    flex-wrap: wrap;
  }
  .promochannel-actions .btn-retro {
    flex: 1;
    min-width: 140px;
  }
  .promochannel-stats {
    gap: 12px;
  }
  .promochannel-type-grid {
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  }
}

/* ── SweetAlert2 Overrides ────────────────────────────────────── */
.swal2-popup {
  background: var(--bg) !important;
  border: 3px solid var(--charcoal) !important;
  border-radius: 24px !important;
  box-shadow: 8px 8px 0px 0px var(--charcoal) !important;
  font-family: 'Inter', sans-serif !important;
  color: var(--charcoal) !important;
}
.swal2-title {
  color: var(--charcoal) !important;
  font-weight: 800 !important;
}
.swal2-html-container {
  color: #4b5563 !important;
}
.swal2-confirm {
  background: var(--charcoal) !important;
  color: var(--sand) !important;
  border-radius: 14px !important;
  border: 3px solid var(--charcoal) !important;
  font-weight: 700 !important;
  box-shadow: 4px 4px 0px 0px var(--charcoal) !important;
}
.swal2-cancel {
  background: var(--white) !important;
  border: 3px solid var(--charcoal) !important;
  color: var(--charcoal) !important;
  border-radius: 14px !important;
  font-weight: 700 !important;
  box-shadow: 4px 4px 0px 0px var(--charcoal) !important;
}
</style>
</head>

/* =========================================================
   FORMAT HELPERS
========================================================= */
function formatNiceDate(raw) {
  if (!raw || raw === '-' ) return '-';
  const d = new Date(raw);
  if (isNaN(d.getTime())) return raw;
  return d.toLocaleDateString(undefined, { day:'2-digit', month:'short', year:'numeric' })
    + ' · ' + d.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
}

/* =========================================================
   TYPE GRID HTML
========================================================= */
function typeSelectorHTML(selectedValue = '') {
  const isKnown  = CHANNEL_TYPES.some(t => t.id === selectedValue);
  const isCustom = selectedValue && !isKnown;
  const activeId = isKnown ? selectedValue : (isCustom ? 'other' : '');
  const customVal = isCustom ? selectedValue : '';

  return `
    <div class="promochannel-type-search-wrap">
      <input type="text" id="typeSearchInput" class="promochannel-type-search" placeholder="Search channel type…" oninput="filterTypeGrid()" autocomplete="off">
    </div>
    <div class="promochannel-type-grid" id="typeGrid">
      ${CHANNEL_TYPES.map(t =>
        `<div class="promochannel-type-opt${t.id === activeId ? ' promochannel-type-opt--selected' : ''}" onclick="selectType('${t.id}')" data-type="${t.id}" data-label="${t.label.toLowerCase()}">
          <span class="promochannel-type-emoji">${t.emoji}</span>${t.label}
        </div>`
      ).join('')}
    </div>
    <input type="hidden" id="selectedChannelType" value="${activeId}">
  `;
}

function selectType(id) {
  document.querySelectorAll('.promochannel-type-opt').forEach(el => {
    el.classList.toggle('promochannel-type-opt--selected', el.dataset.type === id);
  });
  const hidden = document.getElementById('selectedChannelType');
  if (hidden) hidden.value = id;
}

function filterTypeGrid() {
  const q = (document.getElementById('typeSearchInput')?.value || '').toLowerCase().trim();
  document.querySelectorAll('#typeGrid .promochannel-type-opt').forEach(el => {
    el.style.display = (!q || el.dataset.label.includes(q)) ? '' : 'none';
  });
}

function getSelectedChannelTypeValue() {
  const sel = document.getElementById('selectedChannelType');
  return sel ? sel.value : '';
}

/* =========================================================
   LOAD WORKING CHANNEL DATA
========================================================= */
async function loadWorkingChannel() {
  try {
    const pr = await fetch(ChannelCRUDScript
      + `?action=getMyWorkingChannel`
      + `&username=${encodeURIComponent(savedUsername)}`
      + `&password=${encodeURIComponent(savedPassword)}`
    );
    const pd = await pr.json();

    if (pd.status !== 'success') {
      hideLoading();
      await Swal.fire({
        icon: "error",
        title: "Session Expired",
        text: pd.message || "Please sign in again.",
        confirmButtonText: "Go to Sign In",
        customClass: { popup: 'swal2-popup', confirmButton: 'swal2-confirm' }
      });
      localStorage.clear();
      window.location.href = "signin.html";
      return;
    }

    const workingChannels = Array.isArray(pd.channels) ? pd.channels : [];
    if (workingChannels.length > 0) workingChannelId = workingChannels[0].ChannelId;

    renderWorking(workingChannels);
    hideLoading();

  } catch(err) {
    hideLoading();
    Swal.fire({ 
      icon:"error", 
      title:"Error", 
      text:"Unable to load working channel data: " + err.message,
      customClass: { popup: 'swal2-popup', confirmButton: 'swal2-confirm' }
    });
  }
}

function hideLoading() {
  const overlay = document.getElementById('loadingOverlay');
  overlay.classList.add('hide');
  setTimeout(() => overlay.style.display = 'none', 500);
}

/* =========================================================
   RENDER WORKING
========================================================= */
function renderWorking(channels) {
  const container = document.getElementById('workingContainer');
  const badge     = document.getElementById('workingLimitBadge');
  const btn       = document.getElementById('btnAddWorking');

  if (channels.length >= 1) {
    badge.className = 'promochannel-badge promochannel-badge--full';
    badge.innerHTML = '<span class="promochannel-badge-dot"></span>1/1 Account Linked';
    btn.disabled = true;
    btn.classList.add('promochannel-btn-add--disabled');
    btn.onclick = null;
  } else {
    badge.className = 'promochannel-badge promochannel-badge--ok';
    badge.innerHTML = '<span class="promochannel-badge-dot"></span>Slot Available';
  }

  container.innerHTML = channels.length === 0
    ? emptyState('🛡️','No Working Channel Linked','Add the working channel you use to complete assignments.')
    : channels.map(ch => workingChannelCardHTML(ch)).join('');
}

function emptyState(icon, title, desc) {
  return `<div class="promochannel-empty">
    <div class="promochannel-empty-icon">${icon}</div>
    <h2 class="promochannel-empty-title">${title}</h2>
    <p class="promochannel-empty-desc">${desc}</p>
  </div>`;
}

/* =========================================================
   WORKING CHANNEL CARD HTML (REMOVED SUBSCRIPTION STATUS)
========================================================= */
function workingChannelCardHTML(ch) {
  const image = ch.ChannelImage && ch.ChannelImage.trim() ? ch.ChannelImage : "https://cdn-icons-png.flaticon.com/512/1384/1384060.png";
  
  // ChannelType handling
  const channelType = ch.ChannelType || 'Other';
  const typeObj = CHANNEL_TYPES.find(t => t.id === (channelType || '').toLowerCase()) || { emoji:'🌐', label: channelType || 'Other' };
  
  const lastFetched = formatNiceDate(ch.LastTimeFetch || ch.SheetUpdate || '-');

  const issueText = (ch.Issue || '').trim();
  const hasIssue = issueText && issueText.toLowerCase() !== 'no';
  const issueBoxHTML = hasIssue
    ? `<div class="promochannel-notice promochannel-notice--danger">
         <span class="promochannel-notice-label">⚠️ Issue Detected</span>
         <strong class="promochannel-notice-text">${issueText}</strong>
       </div>`
    : '';

  const ytFn = `syncWorkingYT('${ch.ChannelId}')`;
  const changeFn = `openChangeWorkingModal('${ch.ChannelId}')`;

  return `<div class="promochannel-card">
    <div class="promochannel-card-media">
      <div class="promochannel-avatar-ring promochannel-avatar-ring--live">
        <img src="${image}" class="promochannel-avatar" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1384/1384060.png'">
      </div>
    </div>
    <div class="promochannel-card-body">
     
      <h2 class="promochannel-name">${ch.ChannelName||'Unknown Working Account'}</h2>
      <div class="promochannel-handle">${ch.ChannelHandle||'working_handle'}</div>

      <div class="promochannel-stats">
        <div class="promochannel-stat">
          <span class="promochannel-stat-label">Category Mix</span>
          <strong class="promochannel-stat-value">${typeObj.emoji} ${typeObj.label}</strong>
        </div>
        <div class="promochannel-stat">
          <span class="promochannel-stat-label">Outbound Subs</span>
          <strong class="promochannel-stat-value promochannel-stat-value--mono">${ch.TotalSubscription||0}</strong>
        </div>
        <div class="promochannel-stat">
          <span class="promochannel-stat-label">Last Checked</span>
          <strong class="promochannel-stat-value promochannel-stat-value--mono">${lastFetched}</strong>
        </div>
      </div>

      ${issueBoxHTML}

      <a href="https://youtube.com/channel/${ch.ChannelId}" target="_blank" class="promochannel-visit-link">
        View Account Profile <span class="promochannel-visit-arrow">→</span>
      </a>
    </div>
    <div class="promochannel-actions">
      <button onclick="${ytFn}" class="btn-retro btn-sand">🔄 Re-Verify Account Status</button>
      <button onclick="${changeFn}" class="btn-retro btn-mint">🔁 Switch Working Account</button>
    </div>
  </div>`;
}

/* =========================================================
   ADD MODAL
========================================================= */
function openAddModal() {
  Swal.fire({
    title: '🛡️ Link Working Channel',
    width: 600,
    html: `<div style="text-align:left">
      <label class="promochannel-field-label">Working YouTube Channel Link</label>
      <input id="sw_channelLink" class="promochannel-field-input" placeholder="https://youtube.com/@yourworkingprofile">
      <label class="promochannel-field-label">Primary Account Content Focus</label>${typeSelectorHTML()}
    </div>`,
    confirmButtonText: 'Link Working Channel',
    showCancelButton: true,
    cancelButtonText: 'Cancel',
    customClass: {
      popup: 'swal2-popup',
      confirmButton: 'swal2-confirm',
      cancelButton: 'swal2-cancel'
    },
    preConfirm: async () => {
      const channelLink = document.getElementById('sw_channelLink').value.trim();
      const channelType = getSelectedChannelTypeValue();
      if (!channelLink) { Swal.showValidationMessage('Please enter a channel link'); return false; }
      try {
        Swal.showLoading();
        const r = await fetch(ChannelCRUDScript
          + `?action=addWorkingChannel`
          + `&username=${encodeURIComponent(savedUsername)}`
          + `&password=${encodeURIComponent(savedPassword)}`
          + `&channelLink=${encodeURIComponent(channelLink)}`
          + `&channelType=${encodeURIComponent(channelType)}`
        );
        const d = await r.json();
        if (d.status !== 'success') { Swal.showValidationMessage(d.message); return false; }
        return d;
      } catch(e) { Swal.showValidationMessage('Something went wrong. Try again.'); return false; }
    }
  }).then(result => {
    if (result.isConfirmed) {
      Swal.fire({ 
        icon:'success', 
        title:'Connected!', 
        text: 'Working account successfully verified and attached.', 
        timer: 1800, 
        showConfirmButton: false,
        customClass: { popup: 'swal2-popup' }
      });
      setTimeout(() => location.reload(), 1900);
    }
  });
}

/* =========================================================
   SYNC FROM CARD
========================================================= */
async function syncWorkingYT(channelId) {
  Swal.fire({ 
    title:'Syncing data from YouTube…', 
    allowOutsideClick: false, 
    didOpen: () => Swal.showLoading(),
    customClass: { popup: 'swal2-popup' }
  });
  try {
    const r = await fetch(ChannelCRUDScript
      + `?action=updateWorkingChannel`
      + `&username=${encodeURIComponent(savedUsername)}`
      + `&password=${encodeURIComponent(savedPassword)}`
      + `&channelId=${encodeURIComponent(channelId)}`
    );
    const d = await r.json();
    if (d.status !== 'success') { 
      Swal.fire({ 
        icon:'error', 
        title:'Verification Failed', 
        text: d.message,
        customClass: { popup: 'swal2-popup', confirmButton: 'swal2-confirm' }
      }); 
      return; 
    }
    Swal.fire({ 
      icon:'success', 
      title:'Data Synchronized!', 
      timer: 1400, 
      showConfirmButton: false,
      customClass: { popup: 'swal2-popup' }
    });
    setTimeout(() => location.reload(), 1500);
  } catch(e) { 
    Swal.fire({ 
      icon:'error', 
      title:'Error', 
      text:'Unable to update parameters',
      customClass: { popup: 'swal2-popup', confirmButton: 'swal2-confirm' }
    }); 
  }
}

/* =========================================================
   CHANGE WORKING CHANNEL MODAL
========================================================= */
function openChangeWorkingModal(channelId) {
  Swal.fire({
    title:'🔁 Change Working Account',
    width: 600,
    html: `<div style="text-align:left">
      <label class="promochannel-field-label">New Working YouTube Channel Link</label>
      <input id="sw_newChannelLink" class="promochannel-field-input" placeholder="https://youtube.com/@alternativetaskprofile">
      <div class="promochannel-modal-warning" style="margin-top:15px;">
        ⚠️ <strong>Important:</strong> Changing your working channel requires the new channel to have its subscription settings set to public so task processing records do not get broken.
      </div>
    </div>`,
    confirmButtonText: '🔁 Update Working Channel',
    confirmButtonColor: '#f59e0b',
    showCancelButton: true,
    cancelButtonText: 'Cancel',
    customClass: {
      popup: 'swal2-popup',
      confirmButton: 'swal2-confirm',
      cancelButton: 'swal2-cancel'
    },
    preConfirm: async () => {
      const link = document.getElementById('sw_newChannelLink').value.trim();
      if (!link) { Swal.showValidationMessage('Please type the new profile link'); return false; }
      try {
        Swal.showLoading();
        const r = await fetch(ChannelCRUDScript
          + `?action=changeWorkingChannel`
          + `&username=${encodeURIComponent(savedUsername)}`
          + `&password=${encodeURIComponent(savedPassword)}`
          + `&channelLink=${encodeURIComponent(link)}`
        );
        const d = await r.json();
        if (d.status !== 'success') { Swal.showValidationMessage(d.message); return false; }
        return d;
      } catch(e) { Swal.showValidationMessage('Something went wrong. Try again.'); return false; }
    }
  }).then(result => {
    if (result.isConfirmed) {
      Swal.fire({ 
        icon:'success', 
        title:'Account Switch Complete!', 
        text: result.value.message || '', 
        timer: 2200, 
        showConfirmButton: false,
        customClass: { popup: 'swal2-popup' }
      });
      setTimeout(() => location.reload(), 2300);
    }
  });
}

/* =========================================================
   INIT
========================================================= */
loadWorkingChannel();
</script>
